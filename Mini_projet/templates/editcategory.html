{% extends "base.html" %}
{% block content %}

<div class="max-w-4xl mx-auto mt-10">

    <!-- HEADER -->
    <div class="flex items-center justify-between mb-8">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">
                Modifier la catégorie
            </h1>
            <p class="text-gray-500 mt-1">
                Mise à jour des informations de la catégorie
            </p>
        </div>

        <a href="{% url 'admin_dashboard' %}"
           class="inline-flex items-center text-gray-600 hover:text-gray-900">
             Retour au tableau de bord
        </a>
    </div>

    <!-- CARD -->
    <div class="bg-white rounded-2xl shadow-md border border-gray-200">

        <!-- CARD HEADER -->
        <div class="px-8 py-5 border-b bg-gray-50 rounded-t-2xl">
            <h2 class="text-lg font-semibold text-gray-700">
                Informations générales
            </h2>
        </div>

        <!-- CARD BODY -->
        <div class="p-8">
            <form method="post" class="space-y-6">
                {% csrf_token %}

                <!-- NOM -->
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-2">
                        Nom de la catégorie
                    </label>
                    <input
                        type="text"
                        name="name"
                        value="{{ category.name }}"
                        required
                        class="w-full bg-white border border-gray-300 text-gray-800 px-4 py-3 rounded-xl
                               focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                    >
                </div>

                <!-- DESCRIPTION -->
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-2">
                        Description
                    </label>
                    <textarea
                        name="description"
                        rows="4"
                        class="w-full bg-white border border-gray-300 text-gray-800 px-4 py-3 rounded-xl
                               focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                    >{{ category.description }}</textarea>
                </div>

                <!-- STATUT -->
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-2">
                            Statut
                        </label>
                        <select
                            name="status"
                            class="w-full bg-white border border-gray-300 text-gray-800 px-4 py-3 rounded-xl
                                   focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
                        >
                            <option value="ACTIVE" {% if category.status == "ACTIVE" %}selected{% endif %}>
                                Actif
                            </option>
                            <option value="INACTIVE" {% if category.status == "INACTIVE" %}selected{% endif %}>
                                Inactif
                            </option>
                        </select>
                    </div>
                </div>

                <!-- ACTIONS -->
                <div class="flex justify-end gap-4 pt-6 border-t">
                    <a href="{% url 'admin_dashboard' %}"
                       class="px-5 py-2 rounded-xl border border-gray-300 text-gray-700 hover:bg-gray-100">
                        Annuler
                    </a>

                    <button
                        type="submit"
                        class="px-6 py-2 rounded-xl bg-blue-600 text-white font-semibold
                               hover:bg-blue-700 transition"
                    >
                        Enregistrer les modifications
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

{% endblock %}
